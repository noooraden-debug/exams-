<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية الذكية</title>
    <style>
        /* الخلفية المتحركة */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(125deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientAnimation 10s ease infinite;
            color: white;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header { text-align: center; padding: 30px; }
        .main-title { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { font-size: 1.2rem; color: #a1ebde; }

        .container {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 50px;
        }

        /* الصناديق */
        .box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 2px solid #3498db;
        }

        /* العلامة المائية الواضحة داخل الصناديق */
        .watermark-box {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: bold;
            background: rgba(236, 240, 241, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .box img { width: 90px; height: 90px; margin-bottom: 15px; }
        .box h2 { color: #2c3e50; margin: 10px 0; }

        /* الأزرار التفاعلية */
        .btn {
            background-color: #2c3e50;
            color: white;
            padding: 12px 40px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            border: 2px solid #2c3e50;
        }
        .btn:hover {
            background-color: white;
            color: #2c3e50;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="main-title">منصة النماذج الامتحانية الذكية</h1>
        <p class="subtitle">اعداد المبرمج NOUR EDDIN - 0957869853</p>
    </div>

    <div class="container">
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/3061/3061341.png" alt="علوم">
            <h2>اختبار العلوم</h2>
            <a href="Science.html" class="btn">ابدأ الآن</a>
        </div>

        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2942/2942767.png" alt="فيزياء">
            <h2>اختبار الفيزياء</h2>
            <a href="physics.html" class="btn">ابدأ الآن</a>
        </div>

        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2921/2921225.png" alt="كيمياء">
            <h2>اختبار الكيمياء</h2>
            <a href="chemistry.html" class="btn">ابدأ الآن</a>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات التعليمية</title>
    <style>
        body { font-family: sans-serif; background-color: #eef6fc; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00274d; margin-top: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; justify-content: center; margin-top: 30px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card img { width: 100px; height: 100px; margin-bottom: 10px; }
        .card h2 { color: #00274d; font-size: 1.5rem; }
        .btn { display: inline-block; background-color: #27ae60; color: white; padding: 10px 30px; border-radius: 20px; text-decoration: none; margin-top: 10px; }
        footer { margin-top: 40px; color: #555; }
    </style>
</head>
<body>

    <h1>منصة الاختبارات التعليمية</h1>
    <p>اختر الاختبار الذي تود البدء به</p>

    <div class="grid">
        <!-- اختبار العلوم -->
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/3061/3061341.png" alt="علوم">
            <h2>اختبار العلوم</h2>
            <a href="Science.html" class="btn">ابدأ الآن</a>
        </div>

        <!-- اختبار الفيزياء -->
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/2942/2942767.png" alt="فيزياء">
            <h2>اختبار الفيزياء</h2>
            <a href="physics.html" class="btn" style="background-color: #e67e22;">ابدأ الآن</a>
        </div>

        <!-- اختبار الكيمياء -->
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/2921/2921225.png" alt="كيمياء">
            <h2>اختبار الكيمياء</h2>
            <a href="chemistry.html" class="btn" style="background-color: #8e44ad;">ابدأ الآن</a>
        </div>
    </div>

    <footer>&copy; 2024 - منصة الاختبارات التعليمية</footer>

</body>
</html>

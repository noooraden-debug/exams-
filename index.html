<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية الذكية</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: #0b1021; color: white; overflow-x: hidden; }
        
        /* الخلفية التفاعلية: شبكة البيانات الذكية */
        .smart-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1a2a6c 0%, #05070a 100%); overflow: hidden; }
        
        .particle { position: absolute; background: rgba(0, 212, 255, 0.4); border-radius: 50%; animation: moveParticle linear infinite; }
        @keyframes moveParticle { 
            0% { transform: translateY(110vh) translateX(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
        }

        .header { text-align: center; padding: 20px; }
        .main-title { font-size: 2rem; font-weight: bold; color: #00d4ff; text-shadow: 0 0 15px rgba(0,212,255,0.7); }
        .subtitle { font-size: 1.1rem; color: #ffffff; margin-top: 10px; }

        .container { width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 25px; margin-bottom: 50px; }
        
        .box { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); padding: 30px; border-radius: 25px; display: flex; flex-direction: column; align-items: center; position: relative; transition: 0.4s; }
        .box:hover { transform: translateY(-10px); background: rgba(255, 255, 255, 0.12); border-color: #00d4ff; }
        
        .watermark-box { position: absolute; top: 12px; right: 18px; font-size: 0.75rem; color: #00d4ff; font-weight: bold; }
        .box img { width: 85px; height: 85px; margin-bottom: 15px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)); }
        .box h2 { color: #ffffff; margin: 10px 0; font-size: 1.4rem; }
        
        .btn { background: linear-gradient(90deg, #00d4ff, #0055ff); color: white; padding: 13px 45px; border-radius: 30px; text-decoration: none; font-weight: bold; border: none; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 132, 255, 0.4); }
        .btn:hover { box-shadow: 0 0 25px #00d4ff; transform: scale(1.08); }
    </style>
</head>
<body>

    <div class="smart-bg">
        <div class="particle" style="width: 12px; height: 12px; left: 5%; animation-duration: 8s; animation-delay: 0s;"></div>
        <div class="particle" style="width: 8px; height: 8px; left: 15%; animation-duration: 12s; animation-delay: 2s;"></div>
        <div class="particle" style="width: 15px; height: 15px; left: 25%; animation-duration: 10s; animation-delay: 1s;"></div>
        <div class="particle" style="width: 10px; height: 10px; left: 40%; animation-duration: 15s; animation-delay: 4s;"></div>
        <div class="particle" style="width: 20px; height: 20px; left: 55%; animation-duration: 7s; animation-delay: 0s;"></div>
        <div class="particle" style="width: 5px; height: 5px; left: 70%; animation-duration: 11s; animation-delay: 3s;"></div>
        <div class="particle" style="width: 18px; height: 18px; left: 85%; animation-duration: 9s; animation-delay: 2s;"></div>
        <div class="particle" style="width: 12px; height: 12px; left: 95%; animation-duration: 13s; animation-delay: 5s;"></div>
    </div>

    <div class="header">
        <h1 class="main-title">منصة النماذج الامتحانية الذكية</h1>
        <p class="subtitle">اعداد المبرمج NOUR EDDIN - 0957869853</p>
    </div>

    <div class="container">
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/3061/3061341.png" alt="علوم">
            <h2>اختبار العلوم</h2>
            <a href="science.html" class="btn">ابدأ الآن</a>
        </div>
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2942/2942767.png" alt="فيزياء">
            <h2>اختبار الفيزياء</h2>
            <a href="physics.html" class="btn">ابدأ الآن</a>
        </div>
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2921/2921225.png" alt="كيمياء">
            <h2>اختبار الكيمياء</h2>
            <a href="chemistry.html" class="btn">ابدأ الآن</a>
        </div>
    </div>

</body>
</html>

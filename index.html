<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية الذكية</title>
    <style>
        /* إعداد الخلفية المتحركة والذكية */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #09203f 0%, #537895 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            color: white;
        }

        /* العناصر التفاعلية في الخلفية */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .circle {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: move 10s infinite alternate;
        }
        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 100px); }
        }

        .header { text-align: center; padding: 30px; }
        .main-title { font-size: 1.8rem; font-weight: bold; }
        .subtitle { font-size: 1.1rem; color: #a1ebde; }

        .container { width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; margin-bottom: 50px; }
        .box { background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 2px solid #3498db; }
        .watermark-box { position: absolute; top: 10px; right: 15px; font-size: 0.7rem; color: #7f8c8d; font-weight: bold; background: rgba(236, 240, 241, 0.8); padding: 4px 8px; border-radius: 5px; }
        .box img { width: 80px; height: 80px; margin-bottom: 10px; }
        .box h2 { color: #2c3e50; margin: 10px 0; }
        
        .btn { background-color: #2c3e50; color: white; padding: 10px 35px; border-radius: 25px; text-decoration: none; font-weight: bold; transition: 0.3s; border: 2px solid #2c3e50; }
        .btn:hover { background-color: white; color: #2c3e50; transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- عناصر الخلفية التفاعلية -->
    <div class="bg-animation">
        <div class="circle" style="width: 200px; height: 200px; top: 10%; left: 10%;"></div>
        <div class="circle" style="width: 300px; height: 300px; bottom: 10%; right: 10%;"></div>
        <div class="circle" style="width: 100px; height: 100px; top: 50%; left: 30%;"></div>
    </div>

    <div class="header">
        <h1 class="main-title">منصة النماذج الامتحانية الذكية</h1>
        <p class="subtitle">اعداد المبرمج NOUR EDDIN - 0957869853</p>
    </div>

    <div class="container">
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/3061/3061341.png" alt="علوم">
            <h2>اختبار العلوم</h2>
            <a href="science.html" class="btn">ابدأ الآن</a>
        </div>
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2942/2942767.png" alt="فيزياء">
            <h2>اختبار الفيزياء</h2>
            <a href="physics.html" class="btn">ابدأ الآن</a>
        </div>
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2921/2921225.png" alt="كيمياء">
            <h2>اختبار الكيمياء</h2>
            <a href="chemistry.html" class="btn">ابدأ الآن</a>
        </div>
    </div>

</body>
</html>

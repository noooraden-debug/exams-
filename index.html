<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية الذكية</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        /* استيراد خطوط جوجل الحديثة */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            /* تصميم الخلفية العميقة المتدرجة بمؤثرات النيون المضيئة تماماً كالصورة */
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(217, 76, 239, 0.15) 0%, transparent 45%),
                linear-gradient(145deg, #070913 0%, #0c0f1d 50%, #05070f 100%);
            background-attachment: fixed;
            color: white; 
            overflow-x: hidden; 
            position: relative;
        }

        /* إضافة نمط شبكي ورموز برمجية خافتة في الخلفية كما يظهر خلف الهاتف */
        body::before {
            content: "{} </ > function() const index.html css style main.js api";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-family: monospace;
            font-size: 14px;
            color: rgba(0, 240, 255, 0.02);
            word-wrap: break-word;
            padding: 20px;
            line-height: 2;
            pointer-events: none;
            z-index: -2;
            letter-spacing: 4px;
        }
        
        #particles-js { 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            opacity: 0.5;
        }

        /* تنسيق الهيدر العلوي وشعار السلسلة */
        .header { 
            text-align: center; 
            padding: 40px 20px 10px 20px; 
        }

        .brand-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #d946ef;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.15);
        }
        
        .main-title { 
            font-size: 2.4rem; 
            font-weight: 900; 
            background: linear-gradient(135deg, #00f0ff 30%, #ff007f 70%, #d946ef 100%); /* دمج كامل لألوان السلسلة المضيئة */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.25); 
            margin: 0px 0px 8px 0px;
        }

        .header p {
            font-size: 1rem;
            color: #94a3b8;
            margin: 5px 0 0 0;
            font-weight: 400;
        }

        .container { 
            width: 92%; 
            max-width: 480px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            margin-bottom: 120px; 
        }

        /* البطاقات الزجاجية فائقة النقاء - Ultra Glassmorphism */
        .box { 
            background: rgba(10, 15, 30, 0.45); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07); 
            padding: 30px 25px; 
            border-radius: 28px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .box:hover {
            transform: translateY(-5px);
            border-color: rgba(217, 70, 239, 0.3);
            box-shadow: 0 20px 40px rgba(217, 70, 239, 0.12);
        }

        /* الأزرار المتوهجة بتدرج لوني دقيق */
        .btn { 
            background: linear-gradient(90deg, #00f0ff, #d946ef); 
            color: white; 
            padding: 15px 40px; 
            border-radius: 50px; 
            border: none; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer; 
            text-decoration: none; 
            transition: 0.3s all ease; 
            width: 100%; 
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.3);
            font-family: 'Cairo', sans-serif;
        }
        
        .btn:hover { 
            transform: scale(1.02); 
            box-shadow: 0 0 30px rgba(217, 70, 239, 0.6); 
        }

        /* حقول الإدخال والقوائم المنسدلة النيون */
        .lock-input { 
            background: rgba(5, 8, 19, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 15px 20px; 
            border-radius: 18px; 
            color: white; 
            font-size: 1rem; 
            font-family: 'Cairo', sans-serif;
            text-align: center; 
            width: 100%; 
            box-sizing: border-box;
            margin-bottom: 15px; 
            outline: none;
            transition: 0.3s;
        }

        .lock-input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
        }

        .error-message { 
            color: #ff467e; 
            font-size: 0.95rem; 
            margin-top: 10px; 
            display: none; 
            font-weight: bold;
        }
        
        .watermark-box { 
            position: absolute; 
            top: 14px; 
            right: 20px; 
            font-size: 0.7rem; 
            color: #00f0ff; 
            font-weight: 700; 
            letter-spacing: 1px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="header">
        <div class="brand-badge">THE SMART SERIES</div>
        <h1 class="main-title">منصة النماذج الامتحانية الذكية</h1>
        <p>إعداد المبرمج NOUR EDDIN - 0957869853</p>
    </div>

    <div class="container">
        <div id="auth-box" class="box">
            <div class="watermark-box">🔐 قفل الأمان</div>
            <h2 style="font-weight: 700; font-size: 1.4rem; margin-top: 10px;">الرجاء إدخال الرمز السري</h2>
            <input type="password" id="pass-field" class="lock-input" style="width: 85%;" placeholder="أدخل الرمز هنا...">
            <button id="submit-auth-btn" class="btn">تحقق ودخول</button>
            <div id="err-text" class="error-message">❌ الرمز غير صحيح!</div>
        </div>

        <div id="exams-container" style="display: none; flex-direction: column; gap: 25px;"></div>
    </div>

    <script>
        particlesJS("particles-js", {"particles": {"number": {"value": 50}, "color": {"value": "#00f0ff"}, "move": {"enable": true, "speed": 2.5}}});

        const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const defaultImages = {
            "العلوم": "https://cdn-icons-png.flaticon.com/512/3061/3061341.png",
            "الفيزياء": "https://cdn-icons-png.flaticon.com/512/2942/2942767.png",
            "الكيمياء": "https://cdn-icons-png.flaticon.com/512/2921/2921225.png",
            "اللغة الإنجليزية": "https://cdn-icons-png.flaticon.com/512/2991/2991634.png"
        };

        function loadExams() {
            const container = document.getElementById("exams-container");
            db.ref('exams').once('value').then(function(snapshot) {
                const subjects = snapshot.val();
                container.innerHTML = ""; 
                
                for (let subject in subjects) {
                    let box = document.createElement("div");
                    box.className = "box";
                    
                    let imgSrc = subjects[subject][0].img || defaultImages[subject] || "https://cdn-icons-png.flaticon.com/512/1048/1048325.png";
                    
                    let optionsHtml = "";
                    subjects[subject].forEach(exam => {
                        optionsHtml += `<option value="${exam.url}">${exam.name}</option>`;
                    });

                    let selectId = "sel_" + subject.replace(/\s+/g, '');

                    box.innerHTML = `
                        <div class="watermark-box">NOUR EDDIN</div>
                        <img src="${imgSrc}" alt="${subject}" style="width:100px; height:100px; margin-bottom:15px; border-radius:15px;">
                        <h2>${subject}</h2>
                        <select id="${selectId}" class="lock-input">${optionsHtml}</select>
                        <button class="btn" onclick="window.location.href=document.getElementById('${selectId}').value">ابدأ الآن</button>
                    `;
                    container.appendChild(box);
                }
                container.style.display = "flex";
            });
        }

        document.getElementById("submit-auth-btn").addEventListener("click", function() {
            const userInput = document.getElementById("pass-field").value.trim();
            db.ref('password').once('value').then(function(snapshot) {
                if (userInput === String(snapshot.val())) {
                    document.getElementById("auth-box").style.display = "none";
                    loadExams();
                } else {
                    document.getElementById("err-text").style.display = "block";
                }
            });
        });
    </script>
</body>
</html>

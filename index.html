<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SMART SERIES</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #090b14;
            background-image: 
                radial-gradient(circle at 85% 10%, rgba(138, 43, 226, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 10% 45%, rgba(0, 229, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 128, 0.1) 0%, transparent 40%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 430px; /* قياس شاشة هاتف قياسية */
            position: relative;
            padding: 20px 20px 90px 20px;
            overflow-x: hidden;
        }

        /* --- شريط الأيقونات العلوي --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .icon-btn img {
            width: 16px;
            height: 16px;
            filter: invert(1);
            opacity: 0.8;
        }

        .profile-pic {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #00e5ff;
            object-fit: cover;
        }

        /* --- الشعار --- */
        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-svg {
            width: 220px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .established-text {
            font-size: 9px;
            color: #6b7280;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        /* --- نصوص الترحيب --- */
        .welcome-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .welcome-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .welcome-title bdi {
            font-family: sans-serif; /* لضبط شكل الحروف الإنجليزية */
        }

        .welcome-subtitle {
            font-size: 13px;
            color: #9ca3af;
            font-weight: 600;
        }

        /* --- شبكة المواد --- */
        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .subject-card {
            background: rgba(20, 25, 45, 0.6);
            border: 1px solid;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            min-height: 120px;
            backdrop-filter: blur(10px);
        }

        /* ألوان حدود البطاقات كما في الصورة */
        .card-math { border-color: rgba(0, 229, 255, 0.4); box-shadow: 0 4px 20px rgba(0, 229, 255, 0.1); }
        .card-arabic { border-color: rgba(255, 193, 7, 0.4); box-shadow: 0 4px 20px rgba(255, 193, 7, 0.1); }
        .card-english { border-color: rgba(233, 30, 99, 0.4); box-shadow: 0 4px 20px rgba(233, 30, 99, 0.1); }
        .card-history { border-color: rgba(0, 200, 83, 0.4); box-shadow: 0 4px 20px rgba(0, 200, 83, 0.1); }

        .status-ring {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid;
            background: transparent;
        }

        .card-math .status-ring { border-color: #00e5ff; }
        .card-arabic .status-ring { border-color: #ffc107; }
        .card-english .status-ring { border-color: #e91e63; }
        .card-history .status-ring { border-color: #00c853; }

        .subject-card img {
            height: 55px;
            object-fit: contain;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .subject-card h3 {
            font-size: 13px;
            font-weight: 700;
            color: #f3f4f6;
            text-align: center;
            width: 100%;
        }

        /* --- قسم الامتحان التفاعلي --- */
        .exam-section-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding-right: 5px;
        }

        .exam-section-header h2 {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        .exam-box {
            background: rgba(20, 26, 46, 0.8);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* تأثير إضاءة خفيف داخل الصندوق */
        .exam-box::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 100px;
            height: 100px;
            background: rgba(0, 229, 255, 0.2);
            filter: blur(40px);
            border-radius: 50%;
        }

        .exam-subtitle {
            font-size: 13px;
            color: #e5e7eb;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .timer-display {
            font-size: 32px;
            font-weight: 900;
            font-family: monospace;
            letter-spacing: 2px;
            margin: 5px 0 15px 0;
            background: linear-gradient(to right, #ffffff, #f3f4f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .start-btn {
            background: linear-gradient(90deg, #00e5ff, #d946ef);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(217, 70, 239, 0.3);
        }

        /* --- شريط التنقل السفلي بالإنجليزية --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #090b14;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #6b7280;
            font-size: 10px;
            font-family: sans-serif; /* خط إنجليزي سلس */
            font-weight: 600;
            gap: 4px;
        }

        .nav-item.active {
            color: #a855f7; /* لون بنفسجي كما في الصورة */
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="top-bar">
            <div class="icon-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="profile-pic">
        </div>

        <div class="logo-section">
            <svg class="logo-svg" viewBox="0 0 260 110">
                <defs>
                    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00e5ff" />
                        <stop offset="50%" stop-color="#8a2be2" />
                        <stop offset="100%" stop-color="#ff0080" />
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                
                <text x="65" y="25" font-family="'Cairo', sans-serif" font-weight="900" font-size="16" fill="#00e5ff" letter-spacing="1">THE</text>
                
                <path d="M 40,30 L 20,30 Q 10,30 10,40 L 10,65 Q 10,75 20,75 L 240,75 Q 250,75 250,65 L 250,40 Q 250,30 240,30 L 220,30" 
                      fill="none" stroke="url(#neonGradient)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
                
                <text x="130" y="66" font-family="'Cairo', sans-serif" font-weight="900" font-size="42" fill="url(#neonGradient)" text-anchor="middle" letter-spacing="1" filter="url(#glow)">SMART</text>
                
                <text x="130" y="100" font-family="'Cairo', sans-serif" font-weight="800" font-size="16" fill="#e5e7eb" text-anchor="middle" letter-spacing="6">SERIES</text>
            </svg>
            <p class="established-text">سلسلة الذكاء الالكترونية التعليمية - تأسست 2024</p>
        </div>

        <div class="welcome-section">
            <h1 class="welcome-title">أهلاً بك، <bdi>NOUR EDDIN</bdi>!</h1>
            <p class="welcome-subtitle">اكتشف عالم المعرفة</p>
        </div>

        <div class="subjects-grid">
            <div class="subject-card card-math">
                <div class="status-ring"></div>
                <img src="https://cdn-icons-png.flaticon.com/512/3966/3966219.png" alt="Math">
                <h3>الرياضيات تفاعلياً</h3>
            </div>
            
            <div class="subject-card card-arabic">
                <div class="status-ring"></div>
                <img src="https://cdn-icons-png.flaticon.com/512/3389/3389081.png" alt="Arabic">
                <h3>اللغة العربية</h3>
            </div>
            
            <div class="subject-card card-english">
                <div class="status-ring"></div>
                <img src="https://cdn-icons-png.flaticon.com/512/197/197374.png" alt="English">
                <h3>اللغة الإنجليزية</h3>
            </div>
            
            <div class="subject-card card-history">
                <div class="status-ring"></div>
                <img src="https://cdn-icons-png.flaticon.com/512/2942/2942104.png" alt="History">
                <h3>التاريخ والجغرافيا</h3>
            </div>
        </div>

        <div class="exam-section-header">
            <h2>الامتحانات التفاعلية</h2>
        </div>
        
        <div class="exam-box">
            <p class="exam-subtitle">الاختبار التالي: علوم التاسع السوري</p>
            <div class="timer-display">01:23:45</div>
            <button class="start-btn">ابدأ التحدي الآمن</button>
        </div>

    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5.47 15.14L12 18.7l6.53-3.56v1.66L12 20.36l-6.53-3.56v-1.66z"/></svg>
            <span>Courses</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            <span>Exams</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>Community</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Profile</span>
        </a>
    </div>

</body>
</html>

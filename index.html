<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة النماذج الامتحانية</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <input type="text" id="subject-field" placeholder="المادة">
    <input type="password" id="pass-field" placeholder="الرمز">
    <button id="submit-auth-btn">تحقق ودخول</button>

    <script>
        const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById("submit-auth-btn").addEventListener("click", function() {
            let inputSub = document.getElementById("subject-field").value.trim();
            let inputPass = document.getElementById("pass-field").value.trim();
            let targetSub = (inputSub === "علوم") ? "science" : inputSub;

            // نقرأ مسار student1 مباشرة
            db.ref('student1').once('value').then(function(snapshot) {
                let s = snapshot.val();
                
                if (!s) {
                    alert("خطأ: لم يتم العثور على student1 في القاعدة!");
                    return;
                }

                // طباعة ما نراه في القاعدة لنعرف أين المشكلة
                console.log("البيانات في student1 هي:", s);
                
                // مقارنة النصوص (باستخدام String للضمان)
                if (String(s.subject).trim() === targetSub && String(s.password).trim() === inputPass) {
                    window.location.href = targetSub + ".html";
                } else {
                    alert("فشل! في القاعدة: مادة=" + s.subject + "، رمز=" + s.password);
                }
            });
        });
    </script>
</body>
</html>

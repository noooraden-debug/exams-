<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SMART SERIES - منصة النماذج الذكية</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: 
                radial-gradient(circle at 80% 15%, rgba(217, 70, 239, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 20% 55%, rgba(0, 240, 255, 0.15) 0%, transparent 50%),
                linear-gradient(160deg, #060814 0%, #0b0e1a 60%, #05060f 100%);
            background-attachment: fixed;
            color: white; 
            overflow-x: hidden; 
        }
        
        #particles-js { 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            opacity: 0.4;
        }

        .header { 
            text-align: center; 
            padding: 30px 20px 10px 20px; 
            width: 100%;
            max-width: 480px;
        }

        /* تنسيق الشعار المتوهج بدقة وطبق الأصل */
        .logo-text {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00f0ff, #ff007f, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-shadow: 0 0 35px rgba(0, 240, 255, 0.35);
        }

        .sub-logo {
            font-size: 0.75rem;
            color: #94a3b8;
            margin: 4px 0 18px 0;
            opacity: 0.8;
        }

        /* تنسيق الترحيب المحدث باسمك بالإنجليزية */
        .welcome-msg {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 5px 0;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .welcome-sub {
            font-size: 0.85rem;
            color: #a0aec0;
            margin: 0 0 20px 0;
        }

        .container { 
            width: 92%; 
            max-width: 450px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            margin-bottom: 100px; 
        }

        .box-auth {
            background: rgba(13, 20, 38, 0.6); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 35px 25px; 
            border-radius: 24px; 
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 100%;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }

        .subject-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06); 
            padding: 20px 15px; 
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .subject-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 15px 30px rgba(0, 240, 255, 0.15);
        }

        .subject-card img {
            width: 55px; 
            height: 55px; 
            margin-bottom: 12px; 
            object-fit: contain;
        }

        .subject-card h3 {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: #edf2f7;
        }

        .card-select {
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            width: 100%;
            font-family: 'Cairo', sans-serif;
            outline: none;
            text-align: center;
            margin-bottom: 10px;
        }

        .card-btn {
            background: linear-gradient(90deg, #00f0ff, #a855f7);
            color: white;
            border: none;
            padding: 8px 0;
            width: 100%;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.2s;
        }

        .card-btn:hover {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .exam-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #edf2f7;
            margin: 15px 5px 5px 5px;
        }

        .live-exam-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .exam-status {
            font-size: 0.85rem;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .countdown-timer {
            font-size: 1.6rem;
            font-weight: 900;
            color: white;
            font-family: monospace;
            letter-spacing: 2px;
            margin: 5px 0 15px 0;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .action-btn {
            background: linear-gradient(90deg, #00f0ff, #ff007f);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 15px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        .lock-input { 
            background: rgba(5, 8, 19, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 14px; 
            border-radius: 15px; 
            color: white; 
            font-size: 1rem; 
            font-family: 'Cairo', sans-serif;
            text-align: center; 
            width: 100%; 
            margin-bottom: 15px; 
            outline: none;
        }

        .main-btn {
            background: linear-gradient(90deg, #00f0ff, #d946ef);
            color: white; padding: 14px; width: 100%; border: none;
            border-radius: 15px; font-weight: 700; font-size: 1rem;
            cursor: pointer; font-family: 'Cairo', sans-serif;
        }

        .error-message { color: #ff467e; font-size: 0.9rem; margin-top: 10px; display: none; font-weight: bold;}
        .watermark-box { position: absolute; top: 10px; right: 12px; font-size: 0.6rem; color: #00f0ff; font-weight: 700; opacity: 0.5;}

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(10, 14, 28, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #718096;
            text-decoration: none;
            font-size: 0.65rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-item.active, .nav-item:hover {
            color: #00f0ff;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            margin-bottom: 4px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="header">
        <h1 class="logo-text">THE SMART SERIES</h1>
        <p class="sub-logo">سلسلة الذكاء الالكترونية الامتحانية - تأسست 2024</p>
        
        <h2 class="welcome-msg">أهلاً بك، NOUR EDDIN!</h2>
        <p class="welcome-sub">اكتشف عالم المعرفة التفاعلي</p>
    </div>

    <div class="container">
        <div id="auth-box" class="box-auth">
            <div style="font-size: 2rem; margin-bottom: 10px;">🔐</div>
            <h3 style="margin: 0 0 15px 0;">الرجاء إدخال الرمز السري للدخول</h3>
            <input type="password" id="pass-field" class="lock-input" placeholder="أدخل الرمز هنا...">
            <button id="submit-auth-btn" class="main-btn">تحقق ودخول</button>
            <div id="err-text" class="error-message">❌ الرمز غير صحيح!</div>
        </div>

        <div id="main-dashboard" style="display: none; flex-direction: column; gap: 20px;">
            <div id="exams-container" class="subjects-grid"></div>
            
            <h3 class="exam-section-title">الامتحانات التفاعلية</h3>
            <div class="live-exam-box">
                <div class="exam-status" id="exam-title-display">الاختبار التالي: جاري تحميل البيانات...</div>
                <div class="countdown-timer" id="timer">00:00:00</div>
                <button class="action-btn" id="start-exam-action">ابدأ التحدي الآمن</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>الرئيسية</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5.47 15.14L12 18.7l6.53-3.56v1.66L12 20.36l-6.53-3.56v-1.66z"/></svg>
            <span>المواد</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            <span>الامتحانات</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>المجتمع</span>
        </a>
    </div>

    <script>
        particlesJS("particles-js", {"particles": {"number": {"value": 40}, "color": {"value": "#00f0ff"}, "move": {"enable": true, "speed": 2}}});

        const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const defaultImages = {
            "العلوم": "https://cdn-icons-png.flaticon.com/512/3061/3061341.png",
            "الفيزياء": "https://cdn-icons-png.flaticon.com/512/2942/2942767.png",
            "الكيمياء": "https://cdn-icons-png.flaticon.com/512/2921/2921225.png",
            "اللغة الإنجليزية": "https://cdn-icons-png.flaticon.com/512/2991/2991634.png"
        };

        function loadExams() {
            const container = document.getElementById("exams-container");
            db.ref('exams').once('value').then(function(snapshot) {
                const subjects = snapshot.val();
                container.innerHTML = ""; 
                
                let firstExamUrl = "#";
                let firstExamName = "لا يوجد اختبار حالي";

                for (let subject in subjects) {
                    let card = document.createElement("div");
                    card.className = "subject-card";
                    
                    let imgSrc = subjects[subject][0].img || defaultImages[subject] || "https://cdn-icons-png.flaticon.com/512/1048/1048325.png";
                    
                    let optionsHtml = "";
                    subjects[subject].forEach((exam, index) => {
                        optionsHtml += `<option value="${exam.url}">${exam.name}</option>`;
                        if(index === 0 && firstExamUrl === "#") {
                            firstExamUrl = exam.url;
                            firstExamName = exam.name + " - " + subject;
                        }
                    });

                    let selectId = "sel_" + subject.replace(/\s+/g, '');

                    card.innerHTML = `
                        <div class="watermark-box">NOUR EDDIN</div>
                        <img src="${imgSrc}" alt="${subject}">
                        <h3>${subject}</h3>
                        <select id="${selectId}" class="card-select">${optionsHtml}</select>
                        <button class="card-btn" onclick="window.location.href=document.getElementById('${selectId}').value">ابدأ الآن</button>
                    `;
                    container.appendChild(card);
                }
                
                document.getElementById("exam-title-display").innerText = `الاختبار التالي: ${firstExamName}`;
                document.getElementById("start-exam-action").onclick = function() {
                    window.location.href = firstExamUrl;
                };

                document.getElementById("main-dashboard").style.display = "flex";
                startCountdown();
            });
        }

        function startCountdown() {
            let distance = 5025; 
            setInterval(function() {
                if (distance < 0) return;
                let hours = Math.floor(distance / 3600);
                let minutes = Math.floor((distance % 3600) / 60);
                let seconds = Math.floor(distance % 60);
                
                document.getElementById("timer").innerHTML = 
                    (hours < 10 ? "0" + hours : hours) + ":" + 
                    (minutes < 10 ? "0" + minutes : minutes) + ":" + 
                    (seconds < 10 ? "0" + seconds : seconds);
                distance--;
            }, 1000);
        }

        document.getElementById("submit-auth-btn").addEventListener("click", function() {
            const userInput = document.getElementById("pass-field").value.trim();
            db.ref('password').once('value').then(function(snapshot) {
                if (userInput === String(snapshot.val())) {
                    document.getElementById("auth-box").style.display = "none";
                    loadExams();
                } else {
                    document.getElementById("err-text").style.display = "block";
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة النماذج الامتحانية الذكية</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0b1021; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .box { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 15px; margin: 10px; width: 300px; text-align: center; border: 1px solid #00d4ff; }
        .btn { background: #00d4ff; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .select { padding: 8px; width: 100%; margin-bottom: 10px; border-radius: 5px; background: #0b1021; color: white; }
    </style>
</head>
<body>
    <div id="auth-box" class="box">
        <h2>أدخل الرمز السري</h2>
        <input type="password" id="pass-field" style="padding:10px; border-radius:5px; border:none; width: 80%;">
        <button id="submit-auth-btn" class="btn">دخول</button>
    </div>
    <div id="exams-container" style="display: none; flex-direction: column;"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById("submit-auth-btn").addEventListener("click", () => {
            const userInput = document.getElementById("pass-field").value.trim();
            
            // تم تحديث المسار هنا ليبحث عن كلمة السر داخل مجلد exams كما في صورتك
            db.ref('exams/password').once('value').then(snap => {
                if (userInput == snap.val()) {
                    document.getElementById("auth-box").style.display = "none";
                    loadExams();
                } else {
                    alert("رمز خاطئ!");
                }
            });
        });

        function loadExams() {
            const container = document.getElementById("exams-container");
            container.style.display = "flex";
            
            // جلب البيانات من المجلد الفرعي الثاني المسمى exams
            db.ref('exams/exams').once('value').then(snap => {
                const data = snap.val();
                if (!data) return;
                
                for (let subject in data) {
                    let div = document.createElement("div");
                    div.className = "box";
                    div.innerHTML = `<h3>${subject}</h3>`;
                    let select = document.createElement("select");
                    select.className = "select";
                    
                    let items = Object.values(data[subject]);
                    items.forEach(item => {
                        let opt = document.createElement("option");
                        opt.value = item.url;
                        opt.textContent = item.name;
                        select.appendChild(opt);
                    });
                    
                    let btn = document.createElement("button");
                    btn.className = "btn";
                    btn.textContent = "ابدأ الاختبار";
                    btn.onclick = () => window.location.href = select.value;
                    
                    div.appendChild(select);
                    div.appendChild(btn);
                    container.appendChild(div);
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات التعليمية</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); margin-top: 20px; }
        p { color: #ffffff; font-size: 1.2rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; justify-content: center; margin-top: 30px; width: 100%; max-width: 900px; }
        .card { background: rgba(255, 255, 255, 0.9); padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s; }
        .card:hover { transform: translateY(-10px); }
        .card img { width: 80px; height: 80px; margin-bottom: 15px; }
        .card h2 { color: #333; }
        
        .btn { display: inline-block; background-color: #2c3e50; color: white; padding: 12px 35px; border-radius: 25px; text-decoration: none; margin-top: 15px; font-weight: bold; }
        
        .footer-info { 
            margin-top: auto; 
            padding: 30px; 
            color: white; 
            text-align: center;
            background: rgba(0, 0, 0, 0.1);
            width: 100%;
            border-radius: 15px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1>منصة الاختبارات التعليمية</h1>
    <p>اختر الاختبار الذي تود البدء به</p>

    <div class="grid">
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/3061/3061341.png" alt="علوم">
            <h2>اختبار العلوم</h2>
            <a href="Science.html" class="btn">ابدأ الآن</a>
        </div>

        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/2942/2942767.png" alt="فيزياء">
            <h2>اختبار الفيزياء</h2>
            <a href="physics.html" class="btn">ابدأ الآن</a>
        </div>

        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/2921/2921225.png" alt="كيمياء">
            <h2>اختبار الكيمياء</h2>
            <a href="chemistry.html" class="btn">ابدأ الآن</a>
        </div>
    </div>

    <div class="footer-info">
        <p>تم التصميم والتطوير بواسطة: <strong>NOUR EDDIN</strong></p>
        <p>للتواصل: <strong>0957869853</strong></p>
    </div>

</body>
</html>

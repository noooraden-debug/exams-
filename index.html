<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية الذكية</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: #0b1021; color: white; overflow-x: hidden; }
        
        /* الخلفية التفاعلية: تأثير الشبكة الذكية */
        .smart-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-image: radial-gradient(circle, #1a2a6c 0%, #0b1021 100%); }
        .particle { position: absolute; background: rgba(0, 255, 255, 0.5); border-radius: 50%; animation: float 15s infinite linear; }
        @keyframes float { 0% { transform: translateY(100vh) scale(0); } 100% { transform: translateY(-100px) scale(1); } }

        .header { text-align: center; padding: 20px; }
        .main-title { font-size: 2rem; font-weight: bold; color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.5); }
        .subtitle { font-size: 1.1rem; color: #ffffff; }

        .container { width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; margin-bottom: 50px; }
        .box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); padding: 25px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; position: relative; transition: 0.4s; }
        .box:hover { transform: translateY(-10px); background: rgba(255, 255, 255, 0.1); border-color: #00d4ff; }
        
        .watermark-box { position: absolute; top: 10px; right: 15px; font-size: 0.7rem; color: #00d4ff; font-weight: bold; }
        .box img { width: 80px; height: 80px; margin-bottom: 10px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
        .box h2 { color: #ffffff; margin: 10px 0; }
        
        .btn { background: linear-gradient(90deg, #00d4ff, #0055ff); color: white; padding: 12px 40px; border-radius: 30px; text-decoration: none; font-weight: bold; border: none; transition: 0.3s; }
        .btn:hover { box-shadow: 0 0 20px #00d4ff; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="smart-bg">
        <!-- جزيئات ذكية متحركة -->
        <div class="particle" style="width: 10px; height: 10px; left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="width: 15px; height: 15px; left: 30%; animation-delay: 2s;"></div>
        <div class="particle" style="width: 8px; height: 8px; left: 60%; animation-delay: 5s;"></div>
        <div class="particle" style="width: 20px; height: 20px; left: 80%; animation-delay: 8s;"></div>
    </div>

    <div class="header">
        <h1 class="main-title">منصة النماذج الامتحانية الذكية</h1>
        <p class="subtitle">اعداد المبرمج NOUR EDDIN - 0957869853</p>
    </div>

    <div class="container">
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/3061/3061341.png" alt="علوم">
            <h2>اختبار العلوم</h2>
            <a href="science.html" class="btn">ابدأ الآن</a>
        </div>
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2942/2942767.png" alt="فيزياء">
            <h2>اختبار الفيزياء</h2>
            <a href="physics.html" class="btn">ابدأ الآن</a>
        </div>
        <div class="box">
            <div class="watermark-box">NOUR EDDIN | 0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2921/2921225.png" alt="كيمياء">
            <h2>اختبار الكيمياء</h2>
            <a href="chemistry.html" class="btn">ابدأ الآن</a>
        </div>
    </div>

</body>
</html>

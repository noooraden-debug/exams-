<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية الذكية</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0b1021; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 20px; margin: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #00d4ff; backdrop-filter: blur(10px); }
        .btn { background: linear-gradient(90deg, #00d4ff, #0055ff); color: white; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .select { padding: 10px; width: 100%; margin-bottom: 10px; border-radius: 10px; background: #000; color: white; border: 1px solid #00d4ff; }
        h2, h3 { color: #00d4ff; }
    </style>
</head>
<body>

    <div id="auth-box" class="box">
        <h2>🔐 الرمز السري</h2>
        <input type="password" id="pass-field" style="padding:12px; border-radius:10px; border:none; width: 85%; text-align:center;">
        <button id="submit-auth-btn" class="btn">دخول</button>
    </div>

    <div id="exams-container" style="display: none; flex-direction: column; width: 100%; align-items: center;"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById("submit-auth-btn").addEventListener("click", () => {
            const userInput = document.getElementById("pass-field").value.trim();
            
            // المسار بناءً على هيكل صورتك (exams/password)
            db.ref('exams/password').once('value').then(snap => {
                if (userInput == String(snap.val())) {
                    document.getElementById("auth-box").style.display = "none";
                    loadExams();
                } else {
                    alert("❌ الرمز غير صحيح! حاول مجدداً.");
                }
            });
        });

        function loadExams() {
            const container = document.getElementById("exams-container");
            container.style.display = "flex";
            
            // المسار بناءً على صورتك (exams/exams) لجلب المواد
            db.ref('exams/exams').once('value').then(snap => {
                const data = snap.val();
                if (!data) return;
                
                for (let subject in data) {
                    let div = document.createElement("div");
                    div.className = "box";
                    div.innerHTML = `<h3>${subject}</h3>`;
                    
                    let select = document.createElement("select");
                    select.className = "select";
                    
                    let items = Object.values(data[subject]);
                    items.forEach(item => {
                        let opt = document.createElement("option");
                        opt.value = item.url;
                        opt.textContent = item.name;
                        select.appendChild(opt);
                    });
                    
                    let btn = document.createElement("button");
                    btn.className = "btn";
                    btn.textContent = "ابدأ الاختبار";
                    btn.onclick = () => window.location.href = select.value;
                    
                    div.appendChild(select);
                    div.appendChild(btn);
                    container.appendChild(div);
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية الذكية</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        /* استيراد خطوط جوجل الحديثة */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #060913; /* خلفية داكنة جداً وعميقة مثل الصورة */
            color: white; 
            overflow-x: hidden; 
        }
        
        #particles-js { 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
        }

        /* تنسيق الهيدر العلوي */
        .header { 
            text-align: center; 
            padding: 30px 20px 10px 20px; 
        }
        
        .main-title { 
            font-size: 2.2rem; 
            font-weight: 900; 
            background: linear-gradient(135deg, #00f0ff, #d946ef); /* دمج النيون الأزرق والأرجواني */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(217, 70, 239, 0.3); 
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.95rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-top: 5px;
        }

        .container { 
            width: 92%; 
            max-width: 480px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            margin-bottom: 100px; /* مسافة إضافية من أجل شريط التنقل السفلي لاحقاً */
        }

        /* البطاقات الزجاجية المضيئة - Glassmorphism */
        .box { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 25px; 
            border-radius: 24px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            text-align: center; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .box:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 12px 40px 0 rgba(0, 240, 255, 0.15);
        }

        /* الأزرار المضيئة المتدرجة */
        .btn { 
            background: linear-gradient(90deg, #00f0ff, #a855f7); 
            color: white; 
            padding: 14px 40px; 
            border-radius: 50px; 
            border: none; 
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer; 
            text-decoration: none; 
            transition: 0.3s all ease; 
            width: 100%; 
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        
        .btn:hover { 
            transform: scale(1.02); 
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); 
        }

        /* حقول الإدخال والقوائم المنسدلة */
        .lock-input { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 14px 20px; 
            border-radius: 16px; 
            color: white; 
            font-size: 1rem; 
            font-family: 'Cairo', sans-serif;
            text-align: center; 
            width: 100%; 
            box-sizing: border-box;
            margin-bottom: 15px; 
            outline: none;
            transition: 0.3s;
        }

        .lock-input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .error-message { 
            color: #f43f5e; 
            font-size: 0.95rem; 
            margin-top: 10px; 
            display: none; 
            font-weight: bold;
        }
        
        .watermark-box { 
            position: absolute; 
            top: 12px; 
            right: 18px; 
            font-size: 0.7rem; 
            color: #00f0ff; 
            font-weight: bold; 
            letter-spacing: 1px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="header">
        <h1 class="main-title">منصة النماذج الامتحانية الذكية</h1>
        <p>إعداد المبرمج NOUR EDDIN - 0957869853</p>
    </div>

    <div class="container">
        <div id="auth-box" class="box">
            <div class="watermark-box">🔐 قفل الأمان</div>
            <h2>الرجاء إدخال الرمز السري</h2>
            <input type="password" id="pass-field" class="lock-input" style="width: 80%;" placeholder="أدخل الرمز هنا...">
            <button id="submit-auth-btn" class="btn">تحقق ودخول</button>
            <div id="err-text" class="error-message">❌ الرمز غير صحيح!</div>
        </div>

        <div id="exams-container" style="display: none; flex-direction: column; gap: 25px;"></div>
    </div>

    <script>
        particlesJS("particles-js", {"particles": {"number": {"value": 80}, "color": {"value": "#00d4ff"}, "move": {"enable": true, "speed": 4}}});

        const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const defaultImages = {
            "العلوم": "https://cdn-icons-png.flaticon.com/512/3061/3061341.png",
            "الفيزياء": "https://cdn-icons-png.flaticon.com/512/2942/2942767.png",
            "الكيمياء": "https://cdn-icons-png.flaticon.com/512/2921/2921225.png",
            "اللغة الإنجليزية": "https://cdn-icons-png.flaticon.com/512/2991/2991634.png"
        };

        function loadExams() {
            const container = document.getElementById("exams-container");
            db.ref('exams').once('value').then(function(snapshot) {
                const subjects = snapshot.val();
                container.innerHTML = ""; 
                
                for (let subject in subjects) {
                    let box = document.createElement("div");
                    box.className = "box";
                    
                    let imgSrc = subjects[subject][0].img || defaultImages[subject] || "https://cdn-icons-png.flaticon.com/512/1048/1048325.png";
                    
                    let optionsHtml = "";
                    subjects[subject].forEach(exam => {
                        optionsHtml += `<option value="${exam.url}">${exam.name}</option>`;
                    });

                    let selectId = "sel_" + subject.replace(/\s+/g, '');

                    box.innerHTML = `
                        <div class="watermark-box">NOUR EDDIN</div>
                        <img src="${imgSrc}" alt="${subject}" style="width:100px; height:100px; margin-bottom:15px; border-radius:15px;">
                        <h2>${subject}</h2>
                        <select id="${selectId}" class="lock-input">${optionsHtml}</select>
                        <button class="btn" onclick="window.location.href=document.getElementById('${selectId}').value">ابدأ الآن</button>
                    `;
                    container.appendChild(box);
                }
                container.style.display = "flex";
            });
        }

        document.getElementById("submit-auth-btn").addEventListener("click", function() {
            const userInput = document.getElementById("pass-field").value.trim();
            db.ref('password').once('value').then(function(snapshot) {
                if (userInput === String(snapshot.val())) {
                    document.getElementById("auth-box").style.display = "none";
                    loadExams();
                } else {
                    document.getElementById("err-text").style.display = "block";
                }
            });
        });
    </script>
</body>
</html>

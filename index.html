<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية الذكية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #a1ebde, #cbf6f0, #88d4d4, #a1ebde);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .header { text-align: center; padding: 20px; color: #1a5c60; }
        .main-title { font-size: 1.6rem; font-weight: bold; margin: 0; }
        .subtitle { font-size: 1.1rem; margin-top: 5px; }
        .container { width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 30px; }
        .box {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
        }
        .watermark {
            position: absolute;
            bottom: 10px;
            left: 15px;
            font-size: 0.7rem;
            color: rgba(0,0,0,0.15);
            text-align: left;
        }
        .box img { width: 100px; height: 100px; margin-bottom: 15px; object-fit: contain; }
        .box h2 { color: #333; margin: 10px 0; }
        .btn {
            background-color: #2c3e50;
            color: white;
            padding: 12px 40px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="main-title">منصة النماذج الامتحانية الذكية</h1>
        <p class="subtitle">اعداد المبرمج NOUR EDDIN</p>
    </div>

    <div class="container">
        <!-- اختبار العلوم -->
        <div class="box">
            <div class="watermark">NOUR EDDIN<br>0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/3061/3061341.png" alt="علوم">
            <h2>اختبار العلوم</h2>
            <a href="Science.html" class="btn">ابدأ الآن</a>
        </div>

        <!-- اختبار الفيزياء -->
        <div class="box">
            <div class="watermark">NOUR EDDIN<br>0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2942/2942767.png" alt="فيزياء">
            <h2>اختبار الفيزياء</h2>
            <a href="physics.html" class="btn">ابدأ الآن</a>
        </div>

        <!-- اختبار الكيمياء -->
        <div class="box">
            <div class="watermark">NOUR EDDIN<br>0957869853</div>
            <img src="https://cdn-icons-png.flaticon.com/512/2921/2921225.png" alt="كيمياء">
            <h2>اختبار الكيمياء</h2>
            <a href="chemistry.html" class="btn">ابدأ الآن</a>
        </div>
    </div>

</body>
</html>

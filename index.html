<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #0b1021; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center; width: 80%; max-width: 350px; }
        input { display: block; width: 90%; margin: 10px auto; padding: 12px; border-radius: 10px; border: none; }
        button { padding: 12px 30px; background: #00d4ff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="subject-field" placeholder="المادة (علوم)">
        <input type="password" id="pass-field" placeholder="الرمز (123)">
        <button onclick="finalCheck()">دخول</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function finalCheck() {
            let userSub = document.getElementById("subject-field").value.trim();
            let userPass = document.getElementById("pass-field").value.trim();
            
            // تحويل "علوم" إلى "science"
            let target = (userSub === "علوم") ? "science" : userSub;

            db.ref('/').once('value').then(function(snapshot) {
                let data = snapshot.val();
                let found = false;

                // التكرار عبر البيانات (student1، الخ)
                for (let key in data) {
                    let s = data[key];
                    if (s && typeof s === 'object') {
                        // تحويل القيم في Firebase إلى نصوص وقص المسافات
                        let dbSub = String(s.subject).trim();
                        let dbPass = String(s.password).toString().trim();

                        if (dbSub === target && dbPass === userPass) {
                            found = true;
                            window.location.href = dbSub + ".html";
                            return; // توقف عند العثور على التطابق
                        }
                    }
                }
                alert("بيانات غير صحيحة! تأكد من المادة والرمز.");
            });
        }
    </script>
</body>
</html>

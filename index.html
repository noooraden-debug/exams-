<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كاشف بيانات القاعدة</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b1021; color: white; text-align: center; padding-top: 50px; }
        button { padding: 20px; font-size: 18px; cursor: pointer; border-radius: 10px; background: #00d4ff; border: none; }
    </style>
</head>
<body>
    <h2>اضغط الزر لنعرف اسم المجلد الصحيح في Firebase</h2>
    <button id="check-btn">كشف البيانات</button>

    <script>
        const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById("check-btn").addEventListener("click", function() {
            db.ref('/').once('value').then(function(snapshot) {
                let data = snapshot.val();
                if (!data) {
                    alert("القاعدة فارغة تماماً أو الرابط خطأ!");
                } else {
                    // هذا التنبيه سيخبرك بالضبط ما هو اسم المجلد الذي يجب استخدامه
                    alert("المجلدات الموجودة في القاعدة هي: " + Object.keys(data).join(", "));
                }
            }).catch(function(error) {
                alert("خطأ: " + error.message);
            });
        });
    </script>
</body>
</html>

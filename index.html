<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النماذج الامتحانية الذكية</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: #0b1021; color: white; overflow-x: hidden; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: -1; }
        .header { text-align: center; padding: 20px; }
        .main-title { font-size: 2rem; font-weight: bold; color: #00d4ff; text-shadow: 0 0 15px rgba(0,212,255,0.7); }
        .container { width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 25px; margin-bottom: 50px; }
        .box { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); padding: 30px; border-radius: 25px; display: flex; flex-direction: column; align-items: center; position: relative; text-align: center; }
        .btn { background: linear-gradient(90deg, #00d4ff, #0055ff); color: white; padding: 13px 45px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s; margin-top: 10px; width: 100%; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px #00d4ff; }
        .lock-input { background: rgba(0,0,0,0.3); border: 1px solid #00d4ff; padding: 15px 20px; border-radius: 20px; color: white; font-size: 1.1rem; text-align: center; width: 100%; margin-bottom: 10px; }
        .error-message { color: #ff4a4a; font-size: 0.95rem; margin-top: 10px; display: none; }
        .watermark-box { position: absolute; top: 12px; right: 18px; font-size: 0.75rem; color: #00d4ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="header">
        <h1 class="main-title">منصة النماذج الامتحانية الذكية</h1>
        <p>إعداد المبرمج NOUR EDDIN - 0957869853</p>
    </div>

    <div class="container">
        <div id="auth-box" class="box">
            <div class="watermark-box">🔐 قفل الأمان</div>
            <h2>الرجاء إدخال الرمز السري</h2>
            <input type="password" id="pass-field" class="lock-input" style="width: 80%;" placeholder="أدخل الرمز هنا...">
            <button id="submit-auth-btn" class="btn">تحقق ودخول</button>
            <div id="err-text" class="error-message">❌ الرمز غير صحيح!</div>
        </div>

        <div id="exams-container" style="display: none; flex-direction: column; gap: 25px;"></div>
    </div>

    <script>
        particlesJS("particles-js", {"particles": {"number": {"value": 80}, "color": {"value": "#00d4ff"}, "move": {"enable": true, "speed": 4}}});

        const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const defaultImages = {
            "العلوم": "https://cdn-icons-png.flaticon.com/512/3061/3061341.png",
            "الفيزياء": "https://cdn-icons-png.flaticon.com/512/2942/2942767.png",
            "الكيمياء": "https://cdn-icons-png.flaticon.com/512/2921/2921225.png",
            "اللغة الإنجليزية": "https://cdn-icons-png.flaticon.com/512/2991/2991634.png"
        };

        function loadExams() {
            const container = document.getElementById("exams-container");
            db.ref('exams').once('value').then(function(snapshot) {
                const subjects = snapshot.val();
                container.innerHTML = ""; 
                
                for (let subject in subjects) {
                    let box = document.createElement("div");
                    box.className = "box";
                    
                    // جلب الصورة (من أول عنصر في قائمة المادة)
                    let imgSrc = subjects[subject][0].img || defaultImages[subject] || "https://cdn-icons-png.flaticon.com/512/1048/1048325.png";
                    
                    // بناء خيارات الاختبارات
                    let optionsHtml = "";
                    subjects[subject].forEach(exam => {
                        optionsHtml += `<option value="${exam.url}">${exam.name}</option>`;
                    });

                    let selectId = "sel_" + subject.replace(/\s+/g, '');

                    box.innerHTML = `
                        <div class="watermark-box">NOUR EDDIN</div>
                        <img src="${imgSrc}" alt="${subject}" style="width:100px; height:100px; margin-bottom:15px; border-radius:15px;">
                        <h2>${subject}</h2>
                        <select id="${selectId}" class="lock-input">${optionsHtml}</select>
                        <button class="btn" onclick="window.location.href=document.getElementById('${selectId}').value">ابدأ الآن</button>
                    `;
                    container.appendChild(box);
                }
                container.style.display = "flex";
            });
        }

        document.getElementById("submit-auth-btn").addEventListener("click", function() {
            const userInput = document.getElementById("pass-field").value.trim();
            db.ref('password').once('value').then(function(snapshot) {
                if (userInput === String(snapshot.val())) {
                    document.getElementById("auth-box").style.display = "none";
                    loadExams();
                } else {
                    document.getElementById("err-text").style.display = "block";
                }
            });
        });
    </script>
</body>
</html>

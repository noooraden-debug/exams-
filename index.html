/* استبدل الـ CSS القديم بهذا الجزء داخل وسم <style> */

/* إضافة حركة كثيفة ومستمرة */
.smart-bg { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
    background: radial-gradient(circle at center, #0b1021 0%, #05070a 100%);
    overflow: hidden;
}

.particle { 
    position: absolute; background: rgba(0, 212, 255, 0.3); border-radius: 50%; 
    animation: moveParticle linear infinite;
}

@keyframes moveParticle { 
    0% { transform: translateY(110vh) translateX(0); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة الامتحانات</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <input type="text" id="subject-field" placeholder="المادة">
    <input type="password" id="pass-field" placeholder="الرمز">
    <button id="submit-auth-btn" onclick="checkLogin()">تحقق ودخول</button>

    <script>
        // 1. تعريف وظيفة بسيطة
        function checkLogin() {
            alert("تم الضغط على الزر!"); // إذا ظهرت هذه، فالكود يعمل!
            
            const firebaseConfig = { databaseURL: "https://exams-platform-999f6-default-rtdb.firebaseio.com" };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            
            db.ref('/').once('value').then(function(snapshot) {
                alert("تم الاتصال بـ Firebase بنجاح!");
                console.log(snapshot.val());
            }).catch(function(error) {
                alert("خطأ في Firebase: " + error.message);
            });
        }
    </script>
</body>
</html>
